name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The CPU build of torch, so the runner does not download CUDA libraries.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,hf,analysis]"
      - run: ruff check .
      - run: pytest -q
      - name: Toy run on CPU
        run: python -m decide.demo

  report:
    # Recomputes every number of the report from the committed predictions (results/*/predictions_*.jsonl.gz) and
    # checks it against results/summary.json. The training and evaluation runs themselves need a GPU and are not
    # repeated here; scripts/run_all.sh runs them.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[analysis]"
      - run: PYTHONPATH=src python scripts/analyze.py --results results --out /tmp/summary.json
      - run: python scripts/check_summary.py /tmp/summary.json results/summary.json
      - name: CITATION.cff is valid
        run: pipx run cffconvert --validate
